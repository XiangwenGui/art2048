<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>艺术时光2048</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#faf6ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="艺术时光2048">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
</head>
<body>
<div class="app">
  <main class="stage">
   <div class="play">
    <header class="top">
      <div class="titles">
        <h1 data-i18n="title">艺术时光2048</h1>
        <p class="sub" data-i18n="sub"></p>
      </div>
      <button class="lang" id="langBtn" aria-label="Switch language">EN</button>
    </header>
    <div class="hud">
      <div class="score"><span data-i18n="score">分数</span><b id="score">0</b></div>
      <div class="score"><span data-i18n="best">最高</span><b id="best">0</b></div>
      <button id="newBtn" data-i18n="newGame">新游戏</button>
    </div>
    <div class="board" id="board"></div>
    <nav class="bottom">
      <label class="switch mini"><input type="checkbox" id="introEvery" checked><span class="slider"></span><span class="sw-label" data-i18n="autoIntro">每局自动介绍</span></label>
      <button id="galleryBtn" class="ghost"><span data-i18n="gallery">画廊</span> <b id="galleryCount"></b></button>
    </nav>
   </div>
  </main>
</div>

<!-- 顶部小提示：获得拼图块 -->
<div class="toast" id="toast" aria-live="polite"></div>

<!-- 画廊（可滚动） -->
<div class="page" id="gallery" aria-hidden="true">
  <div class="page-head">
    <button class="back" id="galleryClose" data-i18n="back">‹ 返回</button>
    <h2 data-i18n="gallery">画廊</h2>
    <span class="head-spacer"></span>
  </div>
  <div class="page-body" id="galleryBody"></div>
</div>

<!-- 画家卡片：上半画家介绍，下半作品拼图 -->
<div class="page" id="artist" aria-hidden="true">
  <div class="page-head">
    <button class="back" id="artistClose" data-i18n="backGallery">‹ 画廊</button>
    <span class="head-tier" id="artistTier"></span>
  </div>
  <div class="page-body" id="artistBody"></div>
</div>

<!-- 图片来源 -->
<div class="page" id="credits" aria-hidden="true">
  <div class="page-head">
    <button class="back" id="creditsClose" data-i18n="backGallery">‹ 画廊</button>
    <h2 data-i18n="credits">图片来源</h2>
    <span class="head-spacer"></span>
  </div>
  <div class="page-body" id="creditsBody"></div>
</div>

<!-- 局末结算 -->
<div class="page summary" id="summary" aria-hidden="true">
  <div class="page-body" id="summaryBody"></div>
</div>

<!-- 介绍卡 / 拼完揭晓 -->
<div class="modal" id="modal"><div class="card" role="dialog" aria-modal="true" id="card"></div></div>

<!-- 提前查看确认 -->
<div class="modal" id="confirm">
  <div class="card confirm-card" role="alertdialog" aria-modal="true">
    <div class="card-body">
      <div class="lock">🔒</div>
      <p id="cText"></p>
      <div class="btns"><button id="cNo" class="ghost" data-i18n="peekNo">继续挑战</button><button id="cYes" data-i18n="peekYes">直接查看</button></div>
    </div>
  </div>
</div>

<!-- 大图 -->
<div class="viewer" id="viewer"><img id="viewerImg" alt=""><p data-i18n="tapClose">点任意处关闭</p></div>

<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
